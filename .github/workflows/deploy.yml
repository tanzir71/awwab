name: GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Select a working preview or the reviewed app release
        type: choice
        options: [checks, preview, app]
        default: preview
      app_reviewed:
        description: Confirm the religious content review required by SPEC §12 for an app release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check app release review
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'app' && !inputs.app_reviewed
        run: |
          echo 'Complete the religious content review in SPEC §12 before the full app release.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        if: github.event_name != 'workflow_dispatch' || inputs.release != 'preview'
      - run: npm run build -- --mode preview
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'preview'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release != 'checks'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release != 'checks'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
